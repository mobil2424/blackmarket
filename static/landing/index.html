<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b19">
  <meta http-equiv="refresh" content="2;url=/login">
  <title>TiTaN — پنل مدیریت</title>
  <style>
    :root{color-scheme:dark;--bg:#080b19;--card:#11172a;--line:rgba(152,170,220,.16);--text:#f1f5ff;--muted:#9aa6c4;--accent:#8b7cff;--mint:#72e5c1}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,rgba(96,73,210,.24),transparent 45%),linear-gradient(145deg,#080b19,#0c1023 58%,#10142a);font-family:Tahoma,"Segoe UI",sans-serif;color:var(--text)}
    .card{width:min(560px,100%);padding:42px 34px;text-align:center;border:1px solid var(--line);border-radius:24px;background:linear-gradient(150deg,rgba(20,27,50,.94),rgba(12,17,34,.94));box-shadow:0 24px 90px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.04)}
    .mark{width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid rgba(139,124,255,.38);border-radius:22px;background:linear-gradient(145deg,rgba(139,124,255,.22),rgba(114,229,193,.08));color:#c9c2ff;font-size:28px;font-weight:800;letter-spacing:1px}
    h1{margin:0;font-size:29px;letter-spacing:.4px}p{margin:12px 0 25px;color:var(--muted);font-size:14px;line-height:2}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:178px;padding:12px 20px;border:1px solid rgba(170,157,255,.48);border-radius:12px;background:linear-gradient(120deg,#7765ee,#5c56c9);color:white;text-decoration:none;font-size:14px;font-weight:700;box-shadow:0 9px 28px rgba(93,78,207,.28);transition:transform .18s ease,filter .18s ease}
    .button:hover{transform:translateY(-2px);filter:brightness(1.08)}.note{margin:18px 0 0;color:#737e9d;font-size:11px}
    .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);margin-inline-end:6px}
    @media(max-width:520px){.card{padding:34px 22px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">T</div>
    <h1>TiTaN</h1>
    <p>سامانه مدیریت امن و متمرکز کانفیگ‌ها<br>در حال انتقال به صفحه ورود هستید.</p>
    <a class="button" href="/login"><span class="pulse"></span>ورود به پنل</a>
    <div class="note">اگر انتقال خودکار انجام نشد، دکمه بالا را انتخاب کنید.</div>
  </main>
</body>
</html>
